[env]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
build_flags =
    -DCORE_DEBUG_LEVEL=0

# Fork-only build variants with on-stick CJK rendering. Each variant ships
# a single Fusion Pixel Font 12px subset matching its target codec:
#   zh-CN: GB2312 zones 1-55 (~122 KB) via -DCC_BUDDY_CJK_CODEC_GBK
#   ja:    JIS X 0208 rows 1-47 (~104 KB) via -DCC_BUDDY_CJK_CODEC_SJIS
# Bridge ships matching wire codec via CC_BUDDY_CJK_TARGET={zh-CN|ja}.
# No upstream PR — see CONTRIBUTING in the parent repo: "we won't take new
# features". Same drawHUD layout: 4 lines × 12 px = 52 px HUD area.
[env:m5stickc-plus-cjk-zh-cn]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCC_BUDDY_CJK_DISPLAY=1
    -DCC_BUDDY_CJK_CODEC_GBK=1

[env:m5stickc-plus-cjk-ja]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCC_BUDDY_CJK_DISPLAY=1
    -DCC_BUDDY_CJK_CODEC_SJIS=1
