[env]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
build_flags =
    -DCORE_DEBUG_LEVEL=0

# Fork-only build variant with on-stick Simplified Chinese rendering.
# Adds ~120 KB (GB2312 Level 1 glyph table, 3760 chars) to the app
# binary. ASCII still uses the 5x7 GFX font outside drawHUD; drawHUD
# switches to ASC16 (8x16) + GB2312_L1 (16x16) so mixed-script lines
# share a 16 px baseline. No upstream PR — see CONTRIBUTING in the
# parent repo: "we won't take new features".
[env:m5stickc-plus-cjk-zh-cn]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCC_BUDDY_CJK_DISPLAY=1
